name: Deploy ingestion API to Cloud Run (manual)
# Keyless auth via Workload Identity Federation - no JSON keys stored in GitHub.
# Required repo variables: GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA
# Required secret in Secret Manager: gamepulse-api-key (mounted as env var, never in the image)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: gamepulse-ingestion
          region: ${{ vars.GCP_REGION }}
          source: .
          flags: >-
            --min-instances=0 --max-instances=2 --memory=512Mi --concurrency=40
            --allow-unauthenticated
            --set-secrets=GAMEPULSE_API_KEY=gamepulse-api-key:latest
            --set-env-vars=GP_STORE=bigquery,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
