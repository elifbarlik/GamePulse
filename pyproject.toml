[project]
name = "gamepulse"
version = "0.1.0"
description = "End-to-end mobile game analytics data platform (simulated data)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "prometheus-client>=0.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
bigquery = ["dbt-bigquery>=1.9", "google-cloud-bigquery>=3.25"]
streaming = ["confluent-kafka>=2.5"]
dev = ["dbt-duckdb>=1.9", "pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
